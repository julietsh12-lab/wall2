<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교직 그래프</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#14263d;--soft:#56677b;--grid:#dbe5ef;--mark:#ffd43b;--up:#1f9d6b;--down:#d64545}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--ink);word-break:keep-all;
 background-color:#f6f9fc;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;margin:0}
[hidden]{display:none!important}
/* 제출 화면 */
#up{min-height:100%;display:grid;place-items:center;padding:20px}
#up main{width:100%;max-width:420px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:22px}
#up h1{font-size:2rem;margin-bottom:.2em}
#up p{margin:0 0 1em;color:var(--soft)}
#up label{display:block;font-size:.95rem;margin-bottom:.3em}
#name{width:100%;font:inherit;font-size:1.15rem;padding:.6em;border:2px solid var(--ink);border-radius:10px;margin-bottom:14px}
#up .btn{text-align:center;font-family:'Do Hyeon',sans-serif;font-size:1.4rem;padding:.7em;border:2px solid var(--ink);border-radius:12px;background:var(--mark);cursor:pointer;margin:0}
#up .btn[aria-disabled=true]{opacity:.5;pointer-events:none}
#file{position:absolute;opacity:0;width:1px;height:1px}
#prev{width:100%;border-radius:10px;border:2px solid var(--ink);margin-top:14px}
#msg{min-height:1.6em;margin-top:12px;font-size:1.1rem;text-align:center}
.ok{color:var(--up)}.no{color:var(--down)}
/* 그래프 갤러리 */
#wv{height:100%;overflow:hidden;display:grid;grid-template-columns:minmax(220px,22vw) 1fr;gap:2vw;padding:2.5vh 2vw}
#wv aside{display:flex;flex-direction:column;justify-content:center;gap:1.6vh}
#wv h1{font-size:clamp(1.6rem,2.6vw,3rem);line-height:1.15}
#wv aside p{margin:0;color:var(--soft);font-size:clamp(.95rem,1.2vw,1.3rem)}
#qr{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;width:fit-content}
#qr img,#qr canvas{display:block;width:min(18vw,30vh)!important;height:auto!important}
#count{font-family:'Do Hyeon',sans-serif;font-size:clamp(2rem,4vw,4.5rem)}
#count small{font-size:.45em;color:var(--soft)}
#wall{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:1.1vh;min-height:0;height:95vh}
.cell{position:relative;background:#fff;border:2px dashed #9fb0c2;border-radius:10px;overflow:hidden;display:grid;place-items:center;min-height:0}
.cell span{font-family:'Do Hyeon',sans-serif;font-size:clamp(1.4rem,2.4vw,2.6rem);color:#c3cfdb}
.cell.on{border:2px solid var(--ink);cursor:zoom-in}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.cell b{position:absolute;left:0;bottom:0;font-family:'Do Hyeon',sans-serif;font-weight:400;background:var(--mark);padding:.1em .6em;border-top-right-radius:8px;font-size:clamp(.8rem,1.1vw,1.2rem)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cell img{animation:none}}
#adm{align-self:flex-start;font:inherit;font-size:.85rem;padding:.3em .9em;border:1.5px solid #9fb0c2;border-radius:8px;background:transparent;color:var(--soft);cursor:pointer}
body.admin #adm{background:var(--down);border-color:var(--down);color:#fff}
.del{display:none;position:absolute;top:6px;right:6px;width:2.1em;height:2.1em;border-radius:50%;border:2px solid #fff;background:var(--down);color:#fff;font-size:clamp(.9rem,1.2vw,1.3rem);font-weight:700;cursor:pointer;z-index:2}
body.admin .cell.on .del{display:block}
#pw{border:2px solid var(--ink);border-radius:14px;padding:20px;width:min(90vw,340px);font:inherit;color:var(--ink)}
#pw::backdrop{background:rgba(20,38,61,.5)}
#pw label{display:block;font-family:'Do Hyeon',sans-serif;font-size:1.3rem;margin-bottom:.5em}
#pwi{width:100%;font:inherit;font-size:1.3rem;padding:.5em;border:2px solid var(--ink);border-radius:10px;letter-spacing:.2em}
#pwm{min-height:1.4em;margin:.4em 0;color:var(--down);font-size:.95rem}
#pw .row{display:flex;gap:8px;justify-content:flex-end}
#pw button{font:inherit;font-family:'Do Hyeon',sans-serif;font-size:1.1rem;padding:.35em 1em;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
#pwo{background:var(--mark)!important}
#big{position:fixed;inset:0;background:rgba(20,38,61,.9);display:none;place-items:center;cursor:zoom-out;padding:3vh}
#big img{max-width:100%;max-height:88vh;border-radius:10px;background:#fff}
#cap{position:fixed;left:0;right:0;bottom:2vh;text-align:center;color:#fff;font-family:'Do Hyeon',sans-serif;font-size:clamp(1.2rem,2.2vw,2.2rem)}
#cap small{font-family:'Gowun Dodum',sans-serif;font-size:.55em;opacity:.75;margin-left:1em}
</style></head>
<body>
<!-- 제출 화면: 이 파일의 주소 그대로 -->
<div id="up" hidden><main>
  <h1>교직 그래프 제출</h1>
  <p>그래프를 가로로 찍어 올려 주세요.</p>
  <label class="btn" id="pick" for="file">사진 찍기 / 고르기</label>
  <input id="file" type="file" accept="image/*">
  <img id="prev" alt="올린 사진 미리보기" hidden>
  <div id="msg" aria-live="polite"></div>
</main></div>

<!-- 그래프 갤러리: 주소 뒤에 ?view=wall -->
<div id="wv" hidden>
  <aside>
    <h1>우리가 그린<br>교직 그래프</h1>
    <div id="qr"></div>
    <div id="count">0 <small>/ 20</small></div>
    <button id="adm" type="button">관리</button>
  </aside>
  <section id="wall" aria-label="제출된 사진 20칸"></section>
  <dialog id="pw">
    <form method="dialog">
      <label for="pwi">관리자 비밀번호</label>
      <input id="pwi" type="password" autocomplete="off" inputmode="text">
      <div id="pwm" aria-live="polite"></div>
      <div class="row"><button type="button" id="pwc">취소</button><button type="submit" id="pwo">확인</button></div>
    </form>
  </dialog>
  <div id="big"><img alt="크게 보기"><div id="cap"></div></div>
</div>

<script>
// Apps Script 웹 앱 주소 (배포 주소가 바뀌면 여기만 고치세요)
const API='https://script.google.com/macros/s/AKfycbyjIL4ArJwWYGbGWhmT8A101tbWGlFovUwaZ_ULcBHcYw7wcOGAakcTD-lQcPR3-nvG/exec';
// QR이 가리킬 제출 화면 주소. 비워 두면 이 페이지 자신의 주소를 씁니다.
const UPLOAD_URL='';

const isWall=new URLSearchParams(location.search).get('view')==='wall';
const api=(q)=>fetch(API+'?'+q,{credentials:'omit',redirect:'follow'}).then(r=>r.json()).then(j=>{if(!j.ok) throw new Error(j.error||'error'); return j;});

if(!isWall){
  document.getElementById('up').hidden=false;
  const file=document.getElementById('file'),msg=document.getElementById('msg'),pick=document.getElementById('pick'),prev=document.getElementById('prev');
  let token=''; try{ token=localStorage.getItem('gw_token')||''; if(!token){ token=Math.random().toString(36).slice(2,12); localStorage.setItem('gw_token',token);} }catch(e){ token=Math.random().toString(36).slice(2,12); }
  const say=(t,c)=>{msg.textContent=t;msg.className=c||'';}, busy=b=>pick.setAttribute('aria-disabled',b?'true':'false');
  file.addEventListener('change',()=>{
    const f=file.files[0]; if(!f) return;
    busy(true); say('사진을 줄이는 중…');
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL('image/jpeg',.8); URL.revokeObjectURL(img.src);
      prev.src=data; prev.hidden=false; say('올리는 중…');
      fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({data:data,name:'',token:token})})
       .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'error');
          busy(false); pick.textContent='다시 올리기'; say('제출 완료! 화면을 확인해 보세요.','ok'); })
       .catch(e=>{busy(false); say('올리지 못했습니다. 다시 시도해 주세요.','no');});
    };
    img.onerror=()=>{busy(false); say('사진을 읽지 못했습니다. 다른 사진으로 시도해 주세요.','no');};
    img.src=URL.createObjectURL(f); file.value='';
  });
}else{
  document.getElementById('wv').hidden=false;
  const wall=document.getElementById('wall'),big=document.getElementById('big'),cap=document.getElementById('cap'),shown={},pics=[]; let cur=-1;
  const target=UPLOAD_URL||(location.protocol.startsWith('http')?location.origin+location.pathname:'');
  if(target&&window.QRCode) new QRCode(document.getElementById('qr'),{text:target,width:320,height:320});
  else document.getElementById('qr').hidden=true;
  for(let i=0;i<20;i++){const c=document.createElement('div');c.className='cell';c.innerHTML='<span>'+(i+1)+'</span>';wall.appendChild(c);}
  function openBig(i){
    if(!pics[i]) return; cur=i; big.firstElementChild.src=pics[i].data;
    cap.textContent=(i+1)+'번 그래프';
    const sm=document.createElement('small'); sm.textContent='← → 다음 사진 · Esc 닫기'; cap.append(sm);
    big.style.display='grid';
  }
  function step(d){for(let k=1;k<=20;k++){const j=(cur+d*k+20)%20; if(pics[j]){openBig(j);return;}}}
  big.onclick=()=>{big.style.display='none';cur=-1;};
  addEventListener('keydown',e=>{ if(cur<0) return;
    if(e.key==='Escape') big.onclick(); if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1); });
  function fill(i,item,data){
    const c=wall.children[i]; c.innerHTML=''; c.classList.add('on');
    const im=new Image(); im.src=data; im.alt=(i+1)+'번 교직 그래프'; c.appendChild(im);
    const b=document.createElement('b'); b.textContent=i+1; c.appendChild(b);
    const x=document.createElement('button'); x.type='button'; x.className='del'; x.textContent='✕'; x.setAttribute('aria-label',(i+1)+'번 사진 지우기');
    x.onclick=e=>{ e.stopPropagation(); remove(i,item); }; c.appendChild(x);
    pics[i]={data:data,n:item.n}; c.onclick=()=>openBig(i);
  }
  function clearCell(i){
    const c=wall.children[i]; c.className='cell'; c.onclick=null; c.innerHTML='<span>'+(i+1)+'</span>'; pics[i]=null; shown[i]=null;
  }
  // 관리자 모드: 비밀번호를 넣으면 칸마다 ✕ 버튼이 보입니다
  let adminKey='';
  const post=b=>fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'error'); return j; });
  document.getElementById('adm').onclick=()=>{
    if(adminKey){ adminKey=''; document.body.classList.remove('admin'); document.getElementById('adm').textContent='관리'; return; }
    pwi.value=''; pwm.textContent=''; pw.showModal(); pwi.focus();
  };
  const pw=document.getElementById('pw'),pwi=document.getElementById('pwi'),pwm=document.getElementById('pwm');
  document.getElementById('pwc').onclick=()=>pw.close();
  pw.querySelector('form').addEventListener('submit',e=>{
    e.preventDefault(); const k=pwi.value; if(!k) return;
    pwm.textContent='확인하는 중…';
    post({action:'check',key:k}).then(()=>{ adminKey=k; pwi.value=''; pw.close(); document.body.classList.add('admin'); document.getElementById('adm').textContent='관리 끝내기'; })
      .catch(err=>{ pwm.textContent=err.message==='error'?'확인하지 못했습니다.':err.message; pwi.value=''; pwi.focus(); });
  });
  function remove(i,item){
    if(!confirm((i+1)+'번 그래프를 지울까요?')) return;
    post({action:'delete',key:adminKey,id:item.id}).then(refresh).catch(e=>alert('지우지 못했습니다. '+(e.message||'')));
  }
  function refresh(){
    return api('api=list').then(j=>{
      document.getElementById('count').firstChild.textContent=j.items.length+' ';
      for(let i=j.items.length;i<20;i++) if(shown[i]) clearCell(i);
      j.items.forEach((it,i)=>{
        if(shown[i]===it.id) return; shown[i]=it.id;
        api('api=image&id='+encodeURIComponent(it.id)).then(r=>{ if(shown[i]===it.id) fill(i,it,r.data); }).catch(()=>{shown[i]=null;});
      });
    }).catch(()=>{});
  }
  (function poll(){ refresh().finally(()=>setTimeout(poll,4000)); })();
}
</script>
</body></html>
